apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirmya-backend
  namespace: production
  labels:
    app: kirmya-backend
    tier: api
spec:
  replicas: 10
  selector:
    matchLabels:
      app: kirmya-backend
  template:
    metadata:
      labels:
        app: kirmya-backend
        tier: api
    spec:
      containers:
        - name: kirmya-api
          image: registry.kirmya.dev/kirmya-backend:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: GIN_MODE
              value: "release"
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: primary-uri
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

name: Security & Vulnerability Audit Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1' # Weekly security audit on Mondays at 2:00 AM UTC

jobs:
  security-scan:
    name: Security Vulnerability & Secret Leak Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js for npm audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go for vulnerability checking
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Frontend Dependency Vulnerability Audit (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=high || echo "::warning::Frontend npm audit identified non-blocking dependencies to update."

      - name: Backend Go Vulnerability Scan (govulncheck)
        run: |
          cd backend
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::Backend govulncheck identified non-critical advisories."

      - name: Trivy Container & Repository Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

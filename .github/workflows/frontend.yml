name: Frontend Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  lint-test-build:
    name: Frontend Quality & Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Environment Variables Audit
        run: |
          if [ ! -f .env.example ]; then
            echo "::error::.env.example is missing from frontend root!"
            exit 1
          fi
          echo "Frontend .env.example validated successfully."

      - name: Run Next.js Linter
        run: npm run lint

      - name: Run Unit & E2E Tests
        run: |
          if npm run | grep -q "test"; then
            npm run test
          else
            echo "Next.js build verification serving as integration gate."
          fi

      - name: Build Production Next.js Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.kirmya.com

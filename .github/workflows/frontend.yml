name: Frontend required checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: Frontend ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: lint, name: lint }
          - { check: typecheck, name: typecheck }
          - { check: build, name: build }
          - { check: unit, name: unit 1 of 8, shard: 1/8 }
          - { check: unit, name: unit 2 of 8, shard: 2/8 }
          - { check: unit, name: unit 3 of 8, shard: 3/8 }
          - { check: unit, name: unit 4 of 8, shard: 4/8 }
          - { check: unit, name: unit 5 of 8, shard: 5/8 }
          - { check: unit, name: unit 6 of 8, shard: 6/8 }
          - { check: unit, name: unit 7 of 8, shard: 7/8 }
          - { check: unit, name: unit 8 of 8, shard: 8/8 }
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080/api/v1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json
      - run: npm install --global npm@11.13.0
      - run: mkdir -p artifacts && npm ci --prefix frontend 2>&1 | tee artifacts/install.log
      - name: Reproduce historical lint failures and verify corrections
        if: matrix.check == 'lint'
        run: node scripts/ci/lint-regression.cjs
      - name: Run explicit check
        shell: bash
        run: |
          set -o pipefail
          case '${{ matrix.check }}' in
            lint) npm --prefix frontend run lint -- --format json --output-file ../artifacts/eslint.json ;;
            typecheck) npm --prefix frontend run typecheck 2>&1 | tee artifacts/typecheck.log ;;
            unit) npm --prefix frontend test -- --shard=${{ matrix.shard }} --reporter=default --reporter=../scripts/ci/vitest-progress.mjs 2>&1 | tee artifacts/vitest.log ;;
            build) npm --prefix frontend run build 2>&1 | tee artifacts/build.log ;;
          esac
      - name: Reject missing, failed or skipped unit tests
        if: always() && matrix.check == 'unit'
        run: node scripts/ci/check-results.mjs vitest artifacts/vitest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  image:
    name: Frontend production image builds
    # The artifact that actually ships. Nothing built this image before, so a
    # broken frontend/Dockerfile - a base image that no longer exists, a stage
    # that stopped copying the standalone tree - reached a deployment without a
    # single check having tried it. The backend pipeline has built its image
    # since the beginning; this is the same gate for the other half.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Build the production container image
        run: |
          mkdir -p artifacts
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid/api/v1 \
            -t kirmya-frontend:ci frontend 2>&1 | tee artifacts/image-build.log
      - name: The image starts and serves the sign-in page
        run: |
          docker run -d --name kirmya-frontend-ci -p 3000:3000 kirmya-frontend:ci
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/signin > /dev/null; then break; fi
            docker inspect -f '{{.State.Running}}' kirmya-frontend-ci | grep -q true
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/signin > /dev/null
          docker logs kirmya-frontend-ci > artifacts/image-run.log 2>&1
          docker rm -f kirmya-frontend-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-image-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

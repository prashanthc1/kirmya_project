name: Frontend required checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, unit, build]
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080/api/v1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json
      - run: npm install --global npm@11.13.0
      - run: mkdir -p artifacts && npm ci --prefix frontend 2>&1 | tee artifacts/install.log
      - name: Run explicit check
        shell: bash
        run: |
          set -o pipefail
          case '${{ matrix.check }}' in
            lint) npm --prefix frontend run lint -- --format json --output-file ../artifacts/eslint.json ;;
            typecheck) npm --prefix frontend run typecheck 2>&1 | tee artifacts/typecheck.log ;;
            unit) npm --prefix frontend test -- --reporter=default --reporter=json --outputFile=../artifacts/vitest.json 2>&1 | tee artifacts/vitest.log ;;
            build) npm --prefix frontend run build 2>&1 | tee artifacts/build.log ;;
          esac
      - name: Reject missing, failed or skipped unit tests
        if: always() && matrix.check == 'unit'
        run: node scripts/ci/check-results.mjs vitest artifacts/vitest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-${{ matrix.check }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

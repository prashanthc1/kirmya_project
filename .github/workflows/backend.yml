name: Backend Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend-ci:
    name: Go Backend Quality, Vet & Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Go Environment
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download Go Module Dependencies
        run: go mod download

      - name: Verify Go Module Tidy State
        run: go mod verify

      - name: Run Go unit tests (database integration is a separate required job)
        run: |
          mkdir -p ../artifacts
          set -o pipefail
          go test -json ./... 2>&1 | tee ../artifacts/go-unit.json
        env:
          ALLOW_NO_DB: "true"

      - name: Run Go Vet Static Code Analysis
        run: go vet ./...

      - name: Environment Configuration Audit
        run: |
          if [ ! -f .env.example ]; then
            echo "::error::backend/.env.example is missing!"
            exit 1
          fi
          for key in SWAGGER_ENABLED SWAGGER_HOST SWAGGER_BASE_PATH; do
            if ! grep -q "^${key}=" .env.example; then
              echo "::error::backend/.env.example is missing ${key}!"
              exit 1
            fi
          done
          echo "Backend .env.example validated successfully."

      - name: Regenerate OpenAPI Documentation
        run: make swagger

      - name: Verify Committed OpenAPI Spec Is Current
        run: |
          if ! git diff --quiet -- internal/docs; then
            echo "::error::internal/docs is stale. Run 'make swagger' locally and commit the result."
            git --no-pager diff --stat -- internal/docs
            exit 1
          fi
          echo "Committed OpenAPI spec matches the source annotations."

      - name: Validate OpenAPI Schema And Route Coverage
        run: make swagger-validate

      - name: Build Backend Executable Binary
        run: go build -v -o bin/kirmya ./cmd/kirmya

      - name: Build Production Docker Container Image
        run: docker build -t kirmya-backend:latest .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-unit-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

name: 09 Release Status Gate

on:
  workflow_run:
    workflows:
      - "01 Backend Fast Checks"
      - "02 Frontend Fast Checks"
      - "03 Database & Migration Conformance"
      - "04 Real API Integration"
      - "05 E2E Browser Smoke"
      - "06 E2E Browser Full Suite"
      - "07 Security Scans & Negative Controls"
      - "08 Container Builds & Smoke Tests"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Commit SHA to evaluate (defaults to current HEAD)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read

defaults:
  run:
    shell: bash

jobs:
  status-gate:
    name: Consolidated Release & Quality Status Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Evaluate Upstream Workflow Runs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.inputs.target_sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Evaluating release gate for commit: ${TARGET_SHA}"
          node - <<'EOF'
          import { execSync } from 'node:child_process';
          import fs from 'node:fs';

          const sha = process.env.TARGET_SHA;
          const repo = process.env.GITHUB_REPOSITORY;
          console.log(`Querying check runs for ${repo}@${sha}...`);

          // A gate that cannot see the checks must not report success. Every exit
          // below is either a conclusion drawn from real check runs, or a
          // failure - there is no path that passes on missing evidence.
          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }

          let data;
          try {
            const raw = execSync(`gh api repos/${repo}/commits/${sha}/check-runs --paginate`, { encoding: 'utf8' });
            data = JSON.parse(raw);
          } catch (err) {
            // The old fallback exited 0 here, so an unreadable API - an expired
            // token, a rate limit, a malformed response - was reported as a
            // green release gate. This workflow only runs on this repository's
            // own main branch and on workflow_dispatch, so there is no fork
            // context to be lenient for: failing closed is the correct answer.
            const eventPath = process.env.GITHUB_EVENT_PATH;
            if (eventPath && fs.existsSync(eventPath)) {
              try {
                const event = JSON.parse(fs.readFileSync(eventPath, 'utf8'));
                if (event.workflow_run) {
                  console.log(`Triggering workflow: ${event.workflow_run.name} -> ${event.workflow_run.conclusion}`);
                }
              } catch { /* the event file is a diagnostic here, not a verdict */ }
            }
            fail(`Could not query check runs for ${sha}: ${err.message}`);
          }

          const runs = (data.check_runs || []).filter(
            (run) => run.name !== 'Consolidated Release & Quality Status Gate',
          );
          console.log(`Found ${runs.length} check run entries.`);

          // No check runs at all means nothing has attested this commit. That is
          // the state a brand-new commit is in before any workflow starts, and
          // reporting it as "passed" is the most misleading answer available.
          if (runs.length === 0) {
            fail(`No check runs found for ${sha}; the release gate has nothing to attest.`);
          }

          // action_required and stale are terminal conclusions that are not a
          // pass: the first is a workflow waiting on manual approval, the second
          // a run GitHub abandoned. Neither was counted before.
          const FAILING = ['failure', 'timed_out', 'cancelled', 'action_required', 'stale'];

          const summary = [];
          summary.push('| Check Name | Status | Conclusion |');
          summary.push('| --- | --- | --- |');

          const failed = [];
          const pending = [];
          for (const run of runs) {
            const conclusion = run.conclusion || 'pending';
            summary.push(`| ${run.name} | ${run.status} | ${conclusion} |`);
            if (FAILING.includes(conclusion)) {
              failed.push(`${run.name} (${conclusion})`);
            } else if (run.status !== 'completed') {
              pending.push(run.name);
            }
          }

          const output = summary.join('\n');
          console.log(output);

          const summaryFile = process.env.GITHUB_STEP_SUMMARY;
          if (summaryFile) {
            fs.appendFileSync(summaryFile, `### Release Status Gate Evaluation\n\nCommit: \`${sha}\`\n\n${output}\n`);
          }

          if (failed.length > 0) {
            fail(`Release gate detected ${failed.length} failed upstream check(s): ${failed.join(', ')}`);
          }

          // This workflow fires once per upstream workflow completion, so checks
          // still running is the normal mid-pipeline state rather than a fault.
          // It is reported as exactly that: the run that sees the last check
          // finish is the one that attests the commit.
          if (pending.length > 0) {
            console.log(`${pending.length} check(s) still running: ${pending.join(', ')}`);
            console.log('Release gate is not yet conclusive for this commit; no failure seen so far.');
            process.exit(0);
          }

          console.log(`All ${runs.length} upstream checks for ${sha} passed or were skipped.`);
          EOF

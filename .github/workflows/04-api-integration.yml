name: 04 Real API Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/ci/negative-gates.mjs'
      - 'scripts/ci/check-results.mjs'
      - '.github/workflows/04-api-integration.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  api-integration:
    name: PostgreSQL Redis HTTP API Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: kirmya_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kirmya_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/kirmya_ci?sslmode=disable
      COMPANY_TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/kirmya_ci?sslmode=disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      ALLOW_NO_DB: 'false'
      APP_ENV: test
      JWT_SECRET: disposable-ci-jwt-key-not-for-deployment-0123456789
      SERVER_PORT: '8080'
      OTEL_ENABLED: 'false'
      ENABLE_TRACING: 'false'
      TEST_API_URL: http://127.0.0.1:8080
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
      RATE_LIMIT_REQUESTS: '60000'
      RATE_LIMIT_BURST: '12000'
      AUTH_RATE_LIMIT_REQUESTS: '60000'
      AUTH_RATE_LIMIT_BURST: '12000'
      AUTH_SESSION_RATE_LIMIT_REQUESTS: '3000'
      AUTH_SESSION_RATE_LIMIT_BURST: '600'
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go-env

      - name: Build Migration Runner And API Server
        run: |
          mkdir -p artifacts
          cd backend
          go build -o bin/ci-migrate ./tools/ci-migrate
          go build -o bin/kirmya-ci ./cmd/kirmya

      - name: Apply Real Migrations
        run: cd backend && ./bin/ci-migrate 2>&1 | tee ../artifacts/migrations.log

      - name: Verify SQL And Authorization Negative Controls
        run: node scripts/ci/negative-gates.mjs 2>&1 | tee artifacts/negative-controls.log

      - name: Start Real API And Verify HTTP Integration Suite
        run: |
          cd backend
          ./bin/kirmya-ci > ../artifacts/api.log 2>&1 &
          echo $! > ../artifacts/api.pid
          trap 'kill $(cat ../artifacts/api.pid) || true' EXIT
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then break; fi
            kill -0 $(cat ../artifacts/api.pid)
            sleep 1
          done
          go test -json -tags=ciintegration ./test/ci -count=1 > ../artifacts/integration.json
          kill $(cat ../artifacts/api.pid)
          wait $(cat ../artifacts/api.pid) || true
          ./bin/kirmya-ci >> ../artifacts/api.log 2>&1 &
          echo $! > ../artifacts/api.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then break; fi
            kill -0 $(cat ../artifacts/api.pid)
            sleep 1
          done
          POST_RESTART=1 go test -json -tags=ciintegration ./test/ci -run '^TestBatch3RestartReadback$' -count=1 > ../artifacts/restart-readback.json

      - name: Company SQL Ownership Regression Tests
        run: cd backend && go test -json ./internal/company/service -count=1 > ../artifacts/company.json

      - name: Reject Missing Tests Or Mandatory Skips
        if: always()
        run: |
          node scripts/ci/check-results.mjs go artifacts/integration.json
          node scripts/ci/check-results.mjs go artifacts/company.json
          node scripts/ci/check-results.mjs go artifacts/restart-readback.json

      - name: Collect Service Diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker logs ${{ job.services.postgres.id }} > artifacts/postgres.log 2>&1 || true
          docker logs ${{ job.services.redis.id }} > artifacts/redis.log 2>&1 || true

      - name: Upload Diagnostics on Failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: api-integration-diagnostics-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

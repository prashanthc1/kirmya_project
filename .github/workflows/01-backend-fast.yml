name: 01 Backend Fast Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/01-backend-fast.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend-fast:
    name: Backend Lint, Vet, Compile & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go-env

      - name: Download Go Dependencies
        run: go mod download

      - name: Verify Go Module State
        run: go mod verify

      - name: Verify Go Code Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./tools doc.go)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted Go files found:"
            echo "$unformatted"
            exit 1
          fi
          echo "All Go files are properly formatted."

      - name: Run Go Vet Static Code Analysis
        run: go vet ./...

      - name: Environment Configuration Audit
        run: |
          if [ ! -f .env.example ]; then
            echo "::error::backend/.env.example is missing!"
            exit 1
          fi
          for key in SWAGGER_ENABLED SWAGGER_HOST SWAGGER_BASE_PATH; do
            if ! grep -q "^${key}=" .env.example; then
              echo "::error::backend/.env.example is missing ${key}!"
              exit 1
            fi
          done
          echo "Backend .env.example validated successfully."

      - name: Regenerate OpenAPI Documentation
        run: make swagger

      - name: Verify Committed OpenAPI Spec Is Current
        run: |
          if ! git diff --quiet -- internal/docs; then
            echo "::error::internal/docs is stale. Run 'make swagger' locally and commit the result."
            git --no-pager diff --stat -- internal/docs
            exit 1
          fi
          echo "Committed OpenAPI spec matches the source annotations."

      - name: Validate OpenAPI Schema And Route Coverage
        run: make swagger-validate

      - name: Build Backend Binary
        run: go build -v -o bin/kirmya ./cmd/kirmya

      # This job runs without PostgreSQL or Redis, and five packages skip
      # themselves when those are absent. The quality gate below fails on any
      # skip, by design (see scripts/ci/check-results.mjs) — so running ./...
      # here made the gate unsatisfiable: 24 tests skipped every time.
      #
      # The fix is to run what this job can actually run, and to let the jobs
      # that have the infrastructure own the rest, under the same strict gate.
      # Nothing is exempted from being run; the exclusions below are each
      # covered elsewhere:
      #
      #   internal/shared/database   -> 03-database.yml (real PostgreSQL)
      #   internal/company/service   -> 04-api-integration.yml
      #   test/integration           -> 04-api-integration.yml
      #   internal/messaging/pubsub  -> 04-api-integration.yml (real Redis)
      #   internal/shared/middleware -> 04-api-integration.yml (real Redis)
      #
      # Adding a package here without adding it to one of those jobs means its
      # tests run nowhere, which is the failure this gate exists to prevent.
      - name: Run Go Unit Tests
        run: |
          mkdir -p ../artifacts
          set -o pipefail
          infra='kirmya/internal/company/service|kirmya/internal/messaging/pubsub|kirmya/internal/shared/database|kirmya/internal/shared/middleware|kirmya/test/integration'
          go test -json $(go list ./... | grep -vE "^($infra)$") 2>&1 | tee ../artifacts/go-unit.json
        env:
          ALLOW_NO_DB: "true"

      - name: Enforce Unit Test Quality Gate
        if: always()
        run: node ../scripts/ci/check-results.mjs go ../artifacts/go-unit.json

      - name: Upload Diagnostics on Failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: backend-unit-failure-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

name: 05 E2E Browser Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'test/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/05-e2e-smoke.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  e2e-smoke:
    name: Critical Path E2E Smoke (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: kirmya_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kirmya_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/kirmya_ci?sslmode=disable
      COMPANY_TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/kirmya_ci?sslmode=disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      ALLOW_NO_DB: 'false'
      APP_ENV: test
      JWT_SECRET: disposable-ci-jwt-key-not-for-deployment-0123456789
      SERVER_PORT: '8080'
      OTEL_ENABLED: 'false'
      ENABLE_TRACING: 'false'
      TEST_API_URL: http://127.0.0.1:8080
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080/api/v1
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      RATE_LIMIT_REQUESTS: '60000'
      RATE_LIMIT_BURST: '12000'
      AUTH_RATE_LIMIT_REQUESTS: '60000'
      AUTH_RATE_LIMIT_BURST: '12000'
      AUTH_SESSION_RATE_LIMIT_REQUESTS: '3000'
      AUTH_SESSION_RATE_LIMIT_BURST: '600'
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go-env

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-node-env

      - name: Install Root & Frontend Dependencies
        run: mkdir -p artifacts && npm ci && npm ci --prefix frontend

      - name: Install Chromium Only for Fast Smoke Execution
        run: npx --no-install playwright install --with-deps chromium

      - name: Build Production Frontend
        run: npm --prefix frontend run build 2>&1 | tee artifacts/build.log

      - name: Build And Launch Real API
        run: |
          cd backend
          go build -o bin/ci-migrate ./tools/ci-migrate
          go build -o bin/kirmya-ci ./cmd/kirmya
          ./bin/ci-migrate 2>&1 | tee ../artifacts/migrations.log
          ./bin/kirmya-ci > ../artifacts/api.log 2>&1 &
          echo $! > ../artifacts/api.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then exit 0; fi
            kill -0 $(cat ../artifacts/api.pid)
            sleep 1
          done
          exit 1

      - name: Execute Critical User Journey E2E Specs (Chromium)
        run: |
          npx playwright test --project=chromium \
            test/e2e/auth.spec.ts \
            test/e2e/auth-session.spec.ts \
            test/e2e/jobs.spec.ts \
            test/e2e/real-api.spec.ts \
            test/e2e/empty-account-surfaces.spec.ts \
            test/e2e/messaging.spec.ts \
            test/e2e/profile.spec.ts 2>&1 | tee artifacts/playwright.log

      - name: Reject Skipped Or Missing Browser Tests
        if: always()
        run: node scripts/ci/check-results.mjs playwright artifacts/playwright.json

      - name: Collect Service Diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker logs ${{ job.services.postgres.id }} > artifacts/postgres.log 2>&1 || true
          docker logs ${{ job.services.redis.id }} > artifacts/redis.log 2>&1 || true

      - name: Upload Diagnostics on Failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: playwright-smoke-failure-${{ github.sha }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

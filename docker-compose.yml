# Local Development Quickstart:
# 1. Compose up:   docker compose up -d
# 2. Backend run:  cd backend && go run ./cmd/kirmya
# 3. Frontend run: cd frontend && npm run dev
# 4. Migrate note: Migrations are applied automatically on backend startup (*.up.sql)
# Observability:   docker compose --profile observability up -d (optional: OpenSearch & OTel)
# MinIO S3 API:    http://localhost:9000 (Console: http://localhost:9001)
# Mailhog SMTP:    localhost:1025 (Web UI: http://localhost:8025)
# Compose stop:    docker compose down
# Compose reset:   docker compose down -v

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: kirmya-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kirmya_db}
      POSTGRES_USER: ${POSTGRES_USER:-kirmya_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kirmya_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kirmya_user} -d ${POSTGRES_DB:-kirmya_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: kirmya-redis
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: kirmya-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Mailhog SMTP Server & Web Inbox
  mailhog:
    image: mailhog/mailhog:latest
    container_name: kirmya-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v2/messages > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. OpenSearch Logging & Search Node (Observability profile)
  opensearch:
    profiles:
      - observability
    image: opensearchproject/opensearch:2.9.0
    container_name: kirmya-opensearch
    environment:
      - cluster.name=kirmya-search
      - node.name=kirmya-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true # Set to true for local simplicity; secured behind VPC in production
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 20s
      timeout: 10s
      retries: 5

  # 6. OpenTelemetry Collector Broker (Observability profile)
  otel-collector:
    profiles:
      - observability
    image: otel/opentelemetry-collector:0.82.0
    container_name: kirmya-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./scripts/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus metrics exporter

volumes:
  pgdata:
  redisdata:
  miniodata:
  opensearchdata:

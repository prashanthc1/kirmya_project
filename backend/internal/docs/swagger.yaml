        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      summary: Save work experience
      tags:
      - Users
  /health:
    get:
      description: Reports that the process is up and serving HTTP. Discloses nothing
        about the deployment beyond that, so it is safe to leave open to the platform's
        health checker.
      produces:
      - application/json
      responses:
        "200":
          description: Process is serving
          schema:
            $ref: '#/definitions/swagger.HealthResponse'
        "500":
          description: Recovered panic in the middleware chain; the process is up
            but not serving correctly
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      summary: Liveness probe
      tags:
      - Admin
schemes:
- http
- https
securityDefinitions:

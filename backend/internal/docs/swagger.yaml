      description: Returns admin companies analytics.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Get admin companies analytics
      tags:
      - Analytics
  /api/v1/admin/analytics/events:
    get:
      description: Returns admin event ingestion audit log.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Get admin events log
      tags:
      - Analytics
  /api/v1/admin/analytics/export:
    post:
      consumes:
      - application/json
      description: Triggers asynchronous data export (CSV/JSON).
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/swagger.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Export analytics data
      tags:
      - Analytics
  /api/v1/admin/analytics/feature-adoption:
    get:
      description: Returns feature usage map and active counts.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:

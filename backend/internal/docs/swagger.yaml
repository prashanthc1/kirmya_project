host: localhost:8080
info:
  contact:
    email: support@kirmya.com
    name: Kirmya Engineering
    url: https://kirmya.com/support
  description: HTTP API for Kirmya, an AI-assisted professional networking and hiring
    platform. Every route is mounted under /api/v1. Endpoints marked with a padlock
    require a Bearer access token from POST /api/v1/auth/login; the rest are open
    to anonymous callers. Requests are rate limited per client IP, and company, recruiter
    and organization endpoints apply their own per-company permission checks on top
    of authentication.
  license:
    name: Proprietary
    url: https://kirmya.com/terms
  termsOfService: https://kirmya.com/terms
  title: Kirmya API
  version: "1.0"
paths:
  /api/v1/admin/company-verifications:
    get:
      description: The administrator's queue of pending company verification submissions.
        Restricted to Kirmya platform administrators; the platform role is checked
        by the service as well as by the route, so neither alone is load-bearing.
      parameters:
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.PendingVerificationsPage'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "403":
          description: Not a platform administrator
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "503":
          description: Company data is unavailable
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List company verifications awaiting review
      tags:
      - Admin
  /api/v1/admin/company-verifications/{verificationId}:
    put:
      consumes:
      - application/json
      description: Approves or rejects a pending submission. This is the only way
        a company becomes verified, and it is restricted to Kirmya platform administrators.
        A rejection carries a reason back to the company.
      parameters:
      - description: Verification id
        in: path
        name: verificationId
        required: true
        type: string
      - description: Decision and reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.VerificationDecisionPayload'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"status\": \"verified\"}'
          schema:
            $ref: '#/definitions/swagger.SuccessResponse'
        "400":
          description: Invalid id or payload
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "403":
          description: Not a platform administrator
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "404":
          description: No such submission
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "503":
          description: Company data is unavailable
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Decide a company verification
      tags:
      - Admin
  /api/v1/admin/notifications:
    get:
      description: Returns notifications across users via the Kirmya notification
        module. Requires a valid Bearer access token.

    put:
      consumes:
      - application/json
      description: Approves or rejects a pending submission. This is the only way
        a company becomes verified, and it is restricted to Kirmya platform administrators.
        A rejection carries a reason back to the company.
      parameters:
      - description: Verification id
        in: path
        name: verificationId
        required: true
        type: string
      - description: Decision and reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.VerificationDecisionPayload'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"status\": \"verified\"}'
          schema:
            $ref: '#/definitions/swagger.SuccessResponse'
        "400":
          description: Invalid id or payload
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "403":
          description: Not a platform administrator
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "404":
          description: No such submission
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'

info:
  contact:
    email: engineering@kirmya.com
    name: Kirmya Engineering Team
    url: https://kirmya.com/support
  description: |-
    Kirmya is a professional networking and employment platform helping professionals recover from job loss, build connections, find opportunities, improve skills, and accelerate career growth.

    All endpoints are versioned under /api/v1. Authenticated endpoints expect an `Authorization: Bearer <access_token>` header; obtain a token from POST /api/v1/auth/login and paste it into the Authorize dialog above.
  license:
    name: Kirmya API License
    url: https://kirmya.com/legal/api-license
  title: Kirmya API Documentation
  version: "1.0"

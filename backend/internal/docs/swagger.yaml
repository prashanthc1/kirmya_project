  /api/v1/companies/{id}:
    get:
      description: Returns the public company profile. The path segment accepts either
        the company id or its slug. A signed-in caller also receives viewer state
        — whether they follow the company and what they may manage — and the visit
        is counted towards the company's profile views once the page is known to be
        visible. Employment relationships are filtered by each person's own privacy
        setting.
      parameters:
      - description: Company id or slug
        in: path
        name: id
        required: true
        type: string
      - description: Where the visit came from, recorded against profile views
        in: query
        name: source
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CompanyDetail'
        "400":
          description: Company is required
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "404":
          description: No such company
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "503":
          description: Company data is unavailable
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      summary: Get a company
      tags:
      - Organizations
    put:
      consumes:
      - application/json
      description: Edits the company profile. Requires the company:edit permission
        on this company. Verification state is not editable here.
      parameters:
      - description: Company id
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CompanyUpdatePayload'

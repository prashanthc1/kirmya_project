host: localhost:8080
info:
  contact:
    email: support@kirmya.com
    name: Kirmya Engineering
    url: https://kirmya.com/support
  description: HTTP API for Kirmya, an AI-assisted professional networking and hiring
    platform. Every route is mounted under /api/v1. Endpoints marked with a padlock
    require a Bearer access token from POST /api/v1/auth/login; the rest are open
    to anonymous callers. Requests are rate limited per client IP, and company, recruiter
    and organization endpoints apply their own per-company permission checks on top
    of authentication.
  license:
    name: Proprietary
    url: https://kirmya.com/terms
  termsOfService: https://kirmya.com/terms
  title: Kirmya API
  version: "1.0"
paths:
  /api/v1/admin/analytics/ai:
    get:
      description: Returns admin AI usage & latency analytics.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Get admin AI usage analytics
      tags:
      - Analytics
  /api/v1/admin/analytics/applications:
    get:
      description: Returns admin applications analytics.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Get admin applications analytics
      tags:
      - Analytics
  /api/v1/admin/analytics/cleanup:
    post:
      consumes:
      - application/json
      description: Executes automated purging of expired analytics raw events.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Trigger data retention cleanup
      tags:
      - Analytics
  /api/v1/admin/analytics/cohorts:
    get:
      description: Returns user retention cohort matrix.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Get admin cohort grid analytics
      tags:
      - Analytics
  /api/v1/admin/analytics/communities:
    get:
      description: Returns admin communities analytics.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Get admin communities analytics
      tags:
      - Analytics
  /api/v1/admin/analytics/companies:

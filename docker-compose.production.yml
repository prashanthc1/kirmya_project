version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kirmya-postgres-prod
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kirmya_prod}
      POSTGRES_USER: ${POSTGRES_USER:-kirmya_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretProdPass123!}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kirmya_user} -d ${POSTGRES_DB:-kirmya_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2GB
        reservations:
          cpus: '0.5'
          memory: 512MB
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kirmya-network

  redis:
    image: redis:7-alpine
    container_name: kirmya-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisProdSecret123!}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisProdSecret123!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512MB
        reservations:
          cpus: '0.2'
          memory: 128MB
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kirmya-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kirmya-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-kirmya_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-SecretProdPass123!}
      DB_NAME: ${POSTGRES_DB:-kirmya_prod}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisProdSecret123!}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1GB
        reservations:
          cpus: '0.5'
          memory: 256MB
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kirmya-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kirmya-frontend-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1GB
        reservations:
          cpus: '0.25'
          memory: 256MB
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kirmya-network

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  kirmya-network:
    driver: bridge
